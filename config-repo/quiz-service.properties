# Centralized config for quiz-service
server.port=8090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quizdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2005}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Resilience4j circuit breakers (Spring Cloud CircuitBreaker + Resilience4j)
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.generateQuiz.base-config=default
resilience4j.circuitbreaker.instances.getQuestions.base-config=default
resilience4j.circuitbreaker.instances.getScore.base-config=default