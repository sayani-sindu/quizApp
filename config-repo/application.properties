# Shared configuration served to ALL services by the Config Server.
# Any property here can be overridden per-service (e.g. question-service.properties)
# or per-profile (e.g. application-dev.properties).

info.project.name=QuizApp
info.project.version=1.0.0

# --- Observability: Actuator + Micrometer + OpenTelemetry ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Distributed tracing -> Jaeger (OTLP/HTTP)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
# Metrics go to Prometheus (not OTLP), so turn off the OTLP metrics registry
management.otlp.metrics.export.enabled=false