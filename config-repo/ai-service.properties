# Centralized config for ai-service (Spring AI, Phase 3)
server.port=8095

# Spring AI with local Ollama (free). Swap to OpenAI/Anthropic via another profile.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka