spring.application.name=config-server

server.port=8888

# Serve config from the config-repo folder (filesystem). 
# In production point this at a git repository instead:
#   spring.cloud.config.server.git.uri=https://github.com/you/quiz-config-repo
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_LOCATION:file:../config-repo}

# Observability (config-server is not a config client, so set locally)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=config-server